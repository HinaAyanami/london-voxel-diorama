<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>LONDON — A Floating Island</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#070c16;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #scene{display:block;width:100%;height:100%;outline:none;cursor:grab;touch-action:none}
  #scene.grabbing{cursor:grabbing}
  #scrim{position:fixed;left:0;right:0;bottom:0;height:190px;pointer-events:none;z-index:3;background:linear-gradient(to top,rgba(7,15,30,.52),rgba(7,15,30,.12) 45%,rgba(7,15,30,0))}

  /* ---- lower-third title ---- */
  #caption{
    position:fixed;left:clamp(18px,3.4vw,52px);bottom:clamp(16px,3.2vh,44px);
    color:#f3efe4;pointer-events:none;user-select:none;z-index:5;
    text-shadow:0 2px 22px rgba(4,10,24,.9),0 1px 4px rgba(4,10,24,.8);
  }
  #caption .rule{opacity:0;transform:scaleX(.15);transform-origin:0 50%;animation:ruleIn 1s cubic-bezier(.2,.72,.2,1) 1.2s forwards}
  @keyframes ruleIn{to{opacity:1;transform:none}}
  #caption h1{opacity:0;transform:translateY(14px);animation:capUp 1.15s cubic-bezier(.2,.72,.2,1) 1.38s forwards}
  #caption p{opacity:0;transform:translateY(12px);animation:capUp 1.15s cubic-bezier(.2,.72,.2,1) 1.6s forwards}
  @keyframes capUp{to{opacity:1;transform:none}}
  #caption .rule{width:54px;height:2px;background:linear-gradient(90deg,#f3c96a,rgba(243,201,106,0));margin-bottom:11px}
  #caption h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:400;
    font-size:clamp(26px,3.2vw,46px);letter-spacing:.42em;text-indent:.42em;line-height:1;
  }
  #caption p{
    margin-top:9px;font-size:clamp(8.5px,.78vw,11.5px);letter-spacing:.34em;text-transform:uppercase;
    color:#e2eef9;opacity:.95;
  }

  /* ---- rare corner meta ---- */
  #meta{
    position:fixed;right:clamp(14px,2.4vw,38px);bottom:clamp(16px,3.2vh,44px);
    font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:#dfe9f6;
    opacity:0;animation:capIn 1.6s ease 2.2s forwards;pointer-events:none;z-index:5;
    text-shadow:0 1px 14px rgba(3,8,20,.9),0 1px 3px rgba(3,8,20,.7);text-align:right;line-height:1.9;
  }
  #meta b{font-weight:500;color:#f4d38b}

  /* ---- loader ---- */
  #loader{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 42%,#173463 0%,#0a1730 46%,#05080f 100%);
    color:#eef3fb;transition:opacity .9s ease,visibility .9s ease;
  }
  #loader.gone{opacity:0;visibility:hidden}
  #loader .mark{font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,3.6vw,34px);letter-spacing:.6em;text-indent:.6em;color:#f6f1e4;opacity:.96}
  #loader .bar{width:min(190px,34vw);height:2px;background:rgba(255,255,255,.14);margin:22px 0 16px;overflow:hidden;border-radius:2px}
  #loader .bar i{display:block;height:100%;width:36%;background:linear-gradient(90deg,rgba(243,201,106,0),#f3c96a,rgba(243,201,106,0));animation:slide 1.15s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
  #loader .sub{font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:#a8bdd8}
  #loader .err{display:none;max-width:520px;margin-top:18px;font-size:12px;line-height:1.6;color:#ffb4a8;text-align:center;letter-spacing:.02em}
  #loader.failed .bar{display:none}
  #loader.failed .err{display:block}

  #hint{
    position:fixed;left:50%;bottom:clamp(16px,3.2vh,40px);transform:translateX(-50%);
    font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:#f2f7fd;z-index:6;
    pointer-events:none;white-space:nowrap;text-shadow:0 1px 12px rgba(3,8,20,.9);
    opacity:0;animation:hintIn .9s ease 1.4s forwards, hintOut 1.4s ease 10.5s forwards;
  }
  @keyframes hintIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:.78;transform:translate(-50%,0)}}
  @keyframes hintOut{to{opacity:0;visibility:hidden}}
  #hint.sticky{opacity:.9;visibility:visible;animation:none;transition:opacity .5s ease;
    font-size:9.5px;letter-spacing:.2em;color:#fff;text-shadow:0 1px 12px rgba(3,8,18,.95),0 1px 3px rgba(3,8,18,.9)}
  #dot{position:fixed;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#f5cf7a;
    box-shadow:0 0 0 3px rgba(245,207,122,.22),0 0 16px rgba(245,207,122,.85);z-index:7;pointer-events:none;opacity:0;
    transition:opacity .35s ease;transform:translate(-30px,-30px)}
  #label{position:fixed;left:0;top:0;width:336px;z-index:8;pointer-events:none;
    color:#f7fafe;text-shadow:0 0 1px rgba(3,8,18,.9),0 1px 3px rgba(3,8,18,.85),0 2px 14px rgba(3,8,18,.45);
    opacity:0;transform:translate(-600px,-600px);transition:color .45s ease,text-shadow .45s ease,opacity .45s ease}
  #label.on{opacity:1}
  #label.dark{color:#0f1722;text-shadow:0 0 1px rgba(255,255,255,.95),0 1px 3px rgba(255,255,255,.9),0 2px 12px rgba(255,255,255,.45)}
  #leader{position:fixed;left:0;top:0;height:1px;width:0;z-index:7;pointer-events:none;opacity:0;
    background:linear-gradient(90deg,rgba(245,207,122,.95),rgba(245,207,122,0));
    transition:opacity .5s ease;transform:translate(0,0)}
  #label .ln{opacity:0;transform:translateY(9px)}
  #label.on .ln{animation:lnIn .72s cubic-bezier(.2,.72,.2,1) forwards;animation-delay:calc(var(--i) * .13s + .1s)}
  @keyframes lnIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  #label .eyebrow{font-size:8px;letter-spacing:.42em;color:#f2c76c;margin-bottom:10px;
    text-shadow:0 1px 16px rgba(0,0,0,.6)}
  #label.dark .eyebrow{color:#8a5a12;text-shadow:0 1px 12px rgba(255,255,255,.75)}
  #label h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;line-height:1.05;
    letter-spacing:.035em;margin:0 0 8px}
  #labelZh{font-size:13px;letter-spacing:.2em;opacity:.9;margin-bottom:14px;font-weight:500}
  #label p{font-size:13px;line-height:1.9;letter-spacing:.015em;font-weight:500;opacity:.95;margin:0 0 2px}
  @media (max-width:640px){
    #hint{font-size:8px;letter-spacing:.18em}
    #caption h1{letter-spacing:.3em;text-indent:.3em}
    #meta{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #caption,#meta,#caption h1,#caption p,#caption .rule,#label .ln{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="scrim"></div>
<div id="hint">Drag to orbit &middot; Scroll to zoom &middot; Click a landmark</div>

<div id="dot"></div>
<div id="leader"></div>
<div id="label">
  <div class="ln eyebrow" id="labelEyebrow" style="--i:0">LANDMARK</div>
  <h2 class="ln" id="labelName" style="--i:1"></h2>
  <div class="ln" id="labelZh" style="--i:2"></div>
  <p class="ln" id="labelL1" style="--i:3"></p>
  <p class="ln" id="labelL2" style="--i:4"></p>
</div>

<div id="caption">
  <div class="rule"></div>
  <h1>LONDON</h1>
  <p>A floating island &middot; voxel study</p>
</div>

<div id="meta">Twelve seconds<br /><b>one slow orbit</b></div>

<div id="loader">
  <div class="mark">LONDON</div>
  <div class="bar"><i></i></div>
  <div class="sub">raising the island</div>
  <div class="err" id="err"></div>
</div>

<script>/*__THREE__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
